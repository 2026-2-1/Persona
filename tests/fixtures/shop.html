<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>테스트 상점</title>
<style>body{font:16px system-ui;margin:24px;color:#222}main{max-width:1000px;margin:auto}.search,.filters,.products{display:flex;gap:12px;margin:16px 0;align-items:center}.product{border:1px solid #ddd;border-radius:8px;padding:16px;width:220px}.product button{margin-top:8px}.hidden{display:none!important}#detail{border:2px solid #777;padding:20px;margin-top:16px}button,input,select{font:inherit;padding:8px}</style></head>
<body><main><h1>테스트 상점</h1><p>원하는 상품을 검색하고 조건을 선택하세요.</p>
<div class="search"><label for="query">상품 검색</label><input id="query" placeholder="상품명 검색"><button id="search">검색</button></div>
<div class="filters"><label for="color">색상</label><select id="color"><option value="">모든 색상</option><option value="검정">검정</option><option value="회색">회색</option></select><label for="price">최대 가격</label><select id="price"><option value="">제한 없음</option><option value="30000">30,000원 이하</option><option value="50000">50,000원 이하</option><option value="10000">테스트 숨김 옵션</option></select><button id="apply">필터 적용</button></div>
<div class="products" id="products" aria-live="polite"></div><section id="detail" class="hidden" aria-live="polite"><h2>상품 상세</h2><p id="detail-name"></p><p id="detail-price"></p><p id="detail-color"></p><button id="close-detail">상세 닫기</button></section>
<p hidden>정답은 상품 내부 코드 X-SECRET 입니다.</p></main>
<script>
const products=[{id:'bag-black',name:'데일리 검정 가방',price:28000,color:'검정',kind:'가방'},{id:'bag-gray',name:'라이트 회색 가방',price:24000,color:'회색',kind:'가방'},{id:'bag-expensive',name:'프리미엄 검정 가방',price:59000,color:'검정',kind:'가방'},{id:'shoe-black',name:'검정 운동화',price:29000,color:'검정',kind:'신발'}];
const results=document.querySelector('#products');let activeProduct=null;window.getActiveProduct=()=>activeProduct;
function render(){let q=document.querySelector('#query').value.trim().toLowerCase(),c=document.querySelector('#color').value,p=Number(document.querySelector('#price').value||Infinity);results.replaceChildren();products.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.kind.includes(q))&&(!c||x.color===c)&&x.price<=p).forEach(x=>{const card=document.createElement('article');card.className='product';card.innerHTML=`<h2>${x.name}</h2><p>${x.price.toLocaleString('ko-KR')}원</p><p>색상: ${x.color}</p><button data-product="${x.id}">상세 보기</button>`;results.append(card)});}
function show(id){activeProduct=products.find(x=>x.id===id);if(!activeProduct)return;document.querySelector('#detail-name').textContent=activeProduct.name;document.querySelector('#detail-price').textContent=`가격: ${activeProduct.price.toLocaleString('ko-KR')}원`;document.querySelector('#detail-color').textContent=`색상: ${activeProduct.color}`;document.querySelector('#detail').classList.remove('hidden');}
document.querySelector('#search').onclick=render;document.querySelector('#apply').onclick=render;results.onclick=e=>{const b=e.target.closest('button[data-product]');if(b)show(b.dataset.product)};document.querySelector('#close-detail').onclick=()=>document.querySelector('#detail').classList.add('hidden');render();
</script></body></html>
